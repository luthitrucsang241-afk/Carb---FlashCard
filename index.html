<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carb – Vocabulary Learning</title>
<style>
:root{--bg:#f7f2e8;--card:#fff;--side:#efe8d8;--tx:#1f2a44;--mut:#6b7488;--ac:#7c9a82;--ac2:#a99bd6;--bd:#e4dcc9;--sh:0 4px 18px rgba(31,42,68,.08);--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1f2740;--side:#0f1424;--tx:#eceff7;--mut:#a3adc4;--bd:#2d3757;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#1f2740;--side:#0f1424;--tx:#eceff7;--mut:#a3adc4;--bd:#2d3757;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;transition:background .3s,color .3s}
.app{display:flex;min-height:100%}
nav{width:220px;background:var(--side);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;transition:background .3s}
.logo{font:700 1.5rem Georgia,serif;margin:0 8px 18px;color:var(--ac)}
nav a{padding:10px 14px;border-radius:12px;color:var(--tx);text-decoration:none;cursor:pointer;opacity:.8}
nav a.on,nav a:hover{background:var(--card);opacity:1;box-shadow:var(--sh)}
main{flex:1;padding:20px 28px;max-width:1000px;min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top .date{color:var(--mut);font-size:.9em;margin-left:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
h2{font:600 1.5rem Georgia,serif;margin:0 0 14px}h3{margin:0 0 10px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;width:100%}
.top input{flex:1;min-width:140px;width:auto}
button{border:0;border-radius:10px;padding:8px 16px;cursor:pointer;background:var(--ac);color:#fff;transition:transform .15s,opacity .2s}
button:hover{transform:translateY(-1px)}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.p{background:var(--ac2)}button.r{background:#c97b7b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat b{font-size:1.8rem;display:block;color:var(--ac)}.stat span{color:var(--mut);font-size:.85em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row>*{width:auto}
.w{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.w:last-child{border:0}.w .m{flex:1;min-width:0}.w small{color:var(--mut)}
.tag{background:var(--ac2);color:#fff;border-radius:20px;padding:1px 10px;font-size:.75em}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:.75em;color:var(--mut)}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.scene{perspective:1000px;max-width:520px;margin:0 auto 16px;height:280px;cursor:pointer}
.fc{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:6px;overflow:auto}
.face.b{transform:rotateY(180deg);background:linear-gradient(145deg,var(--card),var(--side))}
.big{font:700 2.2rem Georgia,serif}.mut{color:var(--mut)}
.ctr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}#modal>div{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
label{display:block;font-size:.85em;color:var(--mut);margin:8px 0 2px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;z-index:10}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.opt.ok{background:#7c9a82;color:#fff}.opt.no{background:#c97b7b;color:#fff}
@media(max-width:800px){.app{flex-direction:column}nav{width:100%;height:auto;position:sticky;flex-direction:row;overflow-x:auto;padding:10px;z-index:5;align-items:center}.logo{margin:0 8px 0 0}nav a{white-space:nowrap;padding:8px 12px}main{padding:14px}.big{font-size:1.8rem}}
:root{--bg:#e8ebe9;--shell:#f3f5f4;--card:#fff;--side:#eef4f0;--tx:#16221b;--mut:#7b8780;--ac:#1f6b44;--ac2:#3a9d63;--bd:#e4eae6;--sh:0 2px 10px rgba(20,60,40,.05);--dk:#0f4a2c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b100d;--shell:#121a15;--card:#1a241e;--side:#1f2c25;--tx:#eaf2ed;--mut:#93a39a;--bd:#27342c;--ac:#3fae72;--ac2:#2f8f5b}}
:root[data-theme="dark"]{--bg:#0b100d;--shell:#121a15;--card:#1a241e;--side:#1f2c25;--tx:#eaf2ed;--mut:#93a39a;--bd:#27342c;--ac:#3fae72;--ac2:#2f8f5b}
.app{max-width:1400px;width:calc(100% - 40px);margin:20px auto;background:var(--shell);border-radius:30px;padding:12px;min-height:calc(100vh - 40px);box-shadow:0 10px 40px rgba(20,60,40,.1)}
nav{background:transparent;top:32px;height:calc(100vh - 64px);padding:16px 14px}
nav a{border-radius:0;color:var(--mut);opacity:1;position:relative;padding:10px 14px}nav a:hover{background:none;box-shadow:none;color:var(--tx)}nav a.on{background:none;box-shadow:none;color:var(--tx);font-weight:600}nav a.on::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:4px;border-radius:4px;background:var(--ac)}
.logo{display:flex;gap:8px;align-items:center;font:700 1.35rem system-ui,sans-serif;color:var(--tx)}.lg{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:1rem}
.lab{font-size:.7rem;letter-spacing:.1em;color:var(--mut);margin:6px 14px}
.promo{margin-top:auto;border-radius:20px;padding:16px;color:#fff;background:radial-gradient(circle at 85% 0,#2f8f5b,var(--dk) 70%);display:flex;flex-direction:column;gap:8px}.promo small{opacity:.8}.promo button{background:#1f6b44;border:1px solid rgba(255,255,255,.25)}
main{max-width:none;padding:12px 20px}
.top input{border-radius:999px;background:var(--card);border:0;padding:12px 18px;box-shadow:var(--sh)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
h2{font:700 1.8rem system-ui,sans-serif}.big{font-family:system-ui,sans-serif;font-weight:700}
.card{border:0;border-radius:20px}
button{border-radius:999px;padding:9px 20px;background:var(--ac)}button.g{background:transparent;border:1px solid var(--ac);color:var(--ac)}button.p{background:var(--ac2)}button.r{background:#d46a6a}
button.opt{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px}
.tag{background:rgba(58,157,99,.15);color:var(--ac)}
.grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{border:0;border-radius:20px;padding:18px;position:relative}.stat b{color:var(--tx);font-size:2.4rem}
.stat::after{content:"↗";position:absolute;top:14px;right:14px;width:30px;height:30px;border:1px solid var(--bd);border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.stat:first-child{background:linear-gradient(135deg,#25834f,var(--dk));color:#fff}.stat:first-child b,.stat:first-child span{color:#fff}.stat:first-child::after{border-color:rgba(255,255,255,.4)}
.bars{height:160px}.bars i{border-radius:40px;min-height:46px;background:var(--ac2)}.bars i.z{background:repeating-linear-gradient(135deg,var(--bd) 0 2px,transparent 2px 7px);border:1px solid var(--bd)}.bars div:last-child i{background:var(--dk)}
.face{border:0;border-radius:28px}.face.b{background:linear-gradient(145deg,#25834f,var(--dk));color:#fff}.face.b .mut{color:rgba(255,255,255,.75)}
@media(max-width:800px){.app{width:calc(100% - 16px);margin:8px;border-radius:20px;padding:6px}nav{height:auto;top:8px;background:var(--shell)}nav a.on::before,.promo,.lab{display:none}}
:root{--bg:#aab1d6;--shell:#f1f1f1;--card:#fff;--side:#e9e9ef;--tx:#1d1c33;--mut:#8b8aa0;--ac:#2b2a4c;--ac2:#b9a6f5;--bd:#e3e3ea;--dk:#2b2a4c;--navy:#2b2a4c;--bt:#fff;--sh:0 1px 6px rgba(30,30,60,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14142a;--shell:#1c1c34;--card:#26264a;--side:#2e2e55;--tx:#eeeefa;--mut:#9d9cc0;--bd:#33335c;--ac:#b9a6f5;--ac2:#2b7fb8;--dk:#14142a;--navy:#14142a;--bt:#1d1c33}}
:root[data-theme="dark"]{--bg:#14142a;--shell:#1c1c34;--card:#26264a;--side:#2e2e55;--tx:#eeeefa;--mut:#9d9cc0;--bd:#33335c;--ac:#b9a6f5;--ac2:#2b7fb8;--dk:#14142a;--navy:#14142a;--bt:#1d1c33}
.app{border-radius:22px;box-shadow:none}.promo{display:none}
button{color:var(--bt)}button.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}button.p{background:var(--ac2);color:#fff}button.r{color:#fff}
.lg{color:var(--bt)}.av{background:var(--ac2);color:#fff}
.tag{background:rgba(43,127,184,.22);color:var(--tx)}
.card{border-radius:16px}.stat{border-radius:16px}.stat::after{display:none}
.stat:first-child{background:var(--card);color:var(--tx)}.stat:first-child b{color:var(--tx)}.stat:first-child span{color:var(--mut)}.stat b{font-weight:500;font-size:2.2rem}
.bars i{background:var(--ac2)}.bars div:last-child i{background:var(--ac)}
.face.b{background:var(--navy);color:#fff}
.dh{display:grid;grid-template-columns:1fr 320px;gap:24px}.dh>div{min-width:0}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.hero .ht{flex:1;min-width:220px}.hero h3{font:500 1.7rem/1.3 system-ui,sans-serif;margin:6px 0 20px}
.hero button{background:#fff;color:#1d1c33;font-weight:600}
.hc{width:150px;min-height:175px;border-radius:18px;padding:14px;color:#1b1b30;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .2s}.hc:hover{transform:translateY(-4px)}.hc .ic{font-size:1.7rem;margin-top:10px}.hc b{font-size:1.05rem;line-height:1.25;flex:1}.hc small{opacity:.8}.pb{height:3px;background:rgba(0,0,0,.15);border-radius:3px}.pb i{display:block;height:100%;background:#1b1b30;border-radius:3px}
.sr{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin-bottom:20px}.sr .stat span{font-size:.8em}
.sr .stat{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sr .stat>div:first-child{text-align:center}
.spark{width:100%;height:60px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85em}.cal .ch{color:var(--mut);font-size:.75em}.cd{padding:6px 0;border-radius:50%;position:relative}.cd.s::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac2)}.cd.t{background:var(--navy);color:#fff}
.ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#1b1b30;font-size:1.1rem}
@media(max-width:900px){.dh{grid-template-columns:1fr}.sr{grid-template-columns:1fr 1fr}.sr .stat:last-child{grid-column:1/-1}.hc{width:calc(33% - 8px);min-width:110px}}

parent;--card:#fff;--side:transparent;--inp:#f0f4f7;--tx:#0e1116;--mut:#4f5d69;--ac:#111418;--ac2:#2b7fb8;--or:#ffcfa8;--bd:#e0e6ea;--dk:#111418;--navy:#111418;--bt:#fff;--sh:0 1px 8px rgba(14,17,22,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ov:rgba(8,12,18,.74);--bg:#0b0f14;--card:#161c24;--inp:#1f2832;--tx:#f3f6f8;--mut:#a5b4c0;--ac:#f3f6f8;--ac2:#5aa9dc;--bd:#27313b;--dk:#0b0f14;--navy:#0b0f14;--bt:#0e1116}}
:root[data-theme="dark"]{--ov:rgba(8,12,18,.74);--bg:#0b0f14;--card:#161c24;--inp:#1f2832;--tx:#f3f6f8;--mut:#a5b4c0;--ac:#f3f6f8;--ac2:#5aa9dc;--bd:#27313b;--dk:#0b0f14;--navy:#0b0f14;--bt:#0e1116}
.app{width:100%;max-width:none;margin:0;border-radius:0;padding:0;min-height:100vh;box-shadow:none;background:var(--bg)}
nav{top:0;height:100vh;padding:28px 20px}
nav a{color:var(--tx);opacity:.65}nav a.on{opacity:1}nav a:hover{opacity:1;color:var(--tx)}
.logo{font-size:1.5rem;letter-spacing:.02em}.lab{color:var(--mut)}
main{padding:24px 32px}
input,select,textarea{background:var(--inp)}.top input{background:var(--card)}
button.g,button.opt{background:var(--card)}button.opt{background:var(--inp)}
.av{background:var(--ac2);color:#fff}
.tag{background:rgba(255,207,168,.7);color:#1a1a1a}
.cd.s::after{background:var(--ac2)}
.hero{background:linear-gradient(var(--ov),var(--ov)),var(--img) var(--bpos,100% 12%)/cover no-repeat;padding:14px;border-radius:20px;display:grid;grid-template-columns:1.2fr 1.1fr 1fr;gap:14px;align-items:stretch;border:0}
.hero .ht{background:transparent;color:var(--tx);padding:10px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center;border:0}
.hero h3{font-size:1.45rem;margin:6px 0 8px}.hero .hs{margin:0 0 18px;opacity:.75;font-size:.88rem}
.hero button{background:var(--ac);color:var(--bt);align-self:flex-start}
.hl{display:flex;flex-direction:column;gap:8px;min-width:0}
.hc{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:2px 8px;width:auto;min-height:0;flex:1;padding:10px 14px}
.hc b{flex:none}.hc .pb{grid-column:1/-1}
.hi{min-height:0}
.hero{grid-template-columns:1.15fr 1fr 1fr;height:clamp(190px,17vw,235px);padding:12px;gap:12px}
.hero h3{font-size:clamp(1.05rem,1.5vw,1.45rem);margin:4px 0 6px}.hero .hs{font-size:clamp(.74rem,.9vw,.88rem);margin:0 0 12px}
.hero .ht{padding:6px 14px}.hero button{padding:8px 18px;font-size:clamp(.78rem,.95vw,.95rem)}
.hl{gap:6px}.hc{padding:6px 14px;gap:1px 8px;font-size:clamp(.78rem,.95vw,.95rem)}.hc b{font-size:1em}.hc .pb{margin-top:2px}
@media(max-width:900px){.hero{grid-template-columns:1fr;height:auto}.hi{min-height:150px}}
.hc{color:#111418}.hc .pb i{background:#111418}
.bars i{background:var(--ac2)}.bars div:last-child i{background:var(--or)}
.face.b{background:#111418;color:#fff}
button.p{background:var(--ac2);color:#fff}button.r{color:#fff}
@media(max-width:800px){.app{width:100%;margin:0;border-radius:0;padding:0}nav{height:auto;top:0;background:var(--card);padding:10px}main{padding:14px}}
.hero{grid-template-columns:1fr;height:clamp(140px,11.8vw,175px);padding:0 28px;margin-bottom:12px}
.hero .ht{max-width:58%;padding:0}
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.hc{padding:12px 16px;gap:4px 8px;flex:none}.hc .pb{margin-top:4px}
@media(max-width:900px){.hero{height:auto;padding:24px 20px}.hero .ht{max-width:100%}}
@media(max-width:600px){.hl{grid-template-columns:1fr}}

.hero .hs{margin:0 0 10px}
.um{position:relative}
.av{border:0;padding:0;cursor:pointer;overflow:hidden;font:700 1rem system-ui,sans-serif;line-height:1}
.dd{display:none;position:absolute;right:0;top:48px;width:min(270px,86vw);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:8}
.dd.on{display:block}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:7px 6px;font-size:.85em}
.hc{position:relative}.hc button.ed{position:absolute;top:-9px;right:-6px;padding:2px 10px;font-size:.72em;opacity:0;background:#fff;color:#111418;border:1px solid rgba(0,0,0,.2);z-index:2}.hc:hover button.ed,.hc button.ed:focus{opacity:1}@media(hover:none){.hc button.ed{opacity:1}}.sw{width:34px;height:34px;padding:0!important;border-radius:50%!important}
/* ===== Player (flashcards) ===== */
.player{display:flex;align-items:center;gap:4px;width:max-content;max-width:100%;margin:6px auto 12px;padding:8px 14px;background:var(--card);border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.player button{width:44px;height:44px;padding:0;border-radius:50%;background:transparent;color:var(--tx);border:0;display:grid;place-items:center;transition:background .2s,transform .15s,opacity .2s}
.player button:hover{background:color-mix(in srgb,var(--tx) 10%,transparent);transform:none}
.player button:active{transform:scale(.92)}
.player button:disabled{opacity:.3;cursor:default;background:transparent}
.player button svg{width:20px;height:20px}
.player button.main{width:56px;height:56px;margin:0 6px;background:var(--tx);color:var(--bg)}
.player button.main:hover{background:var(--tx);opacity:.88}
.player button.main svg{width:24px;height:24px}
.player button.fv.on{color:#e5484d}
/* ===== Custom select ===== */
.cs{position:relative;display:block}.row>.cs{display:inline-block}
.csb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-width:130px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:9px 14px 9px 18px;text-align:left;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.csb:hover{transform:none;border-color:var(--mut)}
.csb.open{border-color:var(--ac2)}
.csb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csb svg{width:14px;height:14px;flex:none;opacity:.6;transition:transform .2s}.csb.open svg{transform:rotate(180deg)}
.csm{position:fixed;z-index:30;display:none;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:6px;box-shadow:0 16px 44px rgba(0,0,0,.2);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.csm.on{display:block;animation:csin .14s ease-out}
@keyframes csin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cso{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.cso:hover{background:color-mix(in srgb,var(--tx) 8%,transparent)}
.cso.sel{font-weight:600;background:color-mix(in srgb,var(--ac2) 18%,transparent)}

.csm::-webkit-scrollbar{width:8px}.csm::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
/* ===== Lesson card actions ===== */
.hc .edg{position:absolute;top:-11px;right:-6px;display:flex;gap:4px;opacity:0;z-index:2;transition:opacity .15s}
.hc:hover .edg,.hc:focus-within .edg{opacity:1}@media(hover:none){.hc .edg{opacity:1}}
.hc .edg button{padding:2px 10px;font-size:.72em;background:#fff;color:#111418;border:1px solid rgba(0,0,0,.2);border-radius:999px}
.hc .edg button.dl{color:#c0392b}
button.sm{padding:5px 12px;font-size:.8em;flex:none}
/* ===== Calendar ===== */
.calh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}
.calh h3{margin:0;font-size:.95rem;text-transform:none;text-align:center;flex:1;white-space:nowrap}.calh h3::first-letter{text-transform:uppercase}
.cn{display:flex;gap:3px}
.ib{width:26px;height:26px;padding:0!important;border-radius:50%!important;background:transparent;color:var(--tx);border:1px solid var(--bd);display:grid;place-items:center;font-size:1rem;line-height:1}
.ib:hover{background:color-mix(in srgb,var(--tx) 10%,transparent);transform:none}
.cd{cursor:pointer;transition:background .15s}.cd:not(.t):hover{background:color-mix(in srgb,var(--tx) 10%,transparent)}
.cd.sel:not(.t){outline:2px solid var(--ac2);outline-offset:-2px}
.calf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:.85em;min-height:30px}
.calf button:disabled{opacity:.35;cursor:default}

/* ===== Tỷ lệ mặc định ~90% (không cần thu nhỏ trình duyệt) ===== */
html{zoom:.9}
nav{height:calc(100vh / .9)!important}
.app{min-height:calc(100vh / .9)!important}

.sg .stat{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qh .qr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:10px}

function diff(a,b){const n=a.length,m=b.length,W=m+1,T=new Uint16Array((n+1)*W);
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i*W+j]=a[i].n===b[j].n?T[(i+1)*W+j+1]+1:Math.max(T[(i+1)*W+j],T[i*W+j+1]);
 const o=[];let i=0,j=0,du=[],dw=[];
 const fl=()=>{const k=Math.min(du.length,dw.length);for(let x=0;x<k;x++)o.push(['s',du[x],dw[x]]);for(let x=k;x<du.length;x++)o.push(['x',du[x]]);for(let x=k;x<dw.length;x++)o.push(['m','',dw[x]]);du=[];dw=[]};
 while(i<n||j<m){if(i<n&&j<m&&a[i].n===b[j].n){fl();o.push(['o',a[i].r,b[j].r]);i++;j++}
  else if(j>=m||(i<n&&T[(i+1)*W+j]>=T[i*W+j+1])){du.push(a[i].r);i++}else{dw.push(b[j].r);j++}}
 fl();return o}

/* ===== Custom dropdown (thay <select> mặc định) ===== */
(function(){
 const menu=document.createElement('div');menu.className='csm';document.body.appendChild(menu);
 const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
 let cur=null;
 function close(){menu.classList.remove('on');if(cur)cur.btn.classList.remove('open');cur=null}
 function open(sel,btn){
  if(cur&&cur.sel===sel)return close();close();cur={sel,btn};btn.classList.add('open');
  menu.innerHTML='';
  [...sel.options].forEach((o,i)=>{const d=document.createElement('div');d.className='cso'+(i===sel.selectedIndex?' sel':'');d.textContent=o.textContent;
   d.onclick=()=>{sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));btn.firstChild.textContent=o.textContent;close()};menu.appendChild(d)});
  const r=btn.getBoundingClientRect(),below=innerHeight-r.bottom-16,above=r.top-16,up=below<220&&above>below,mh=Math.min(340,up?above:below);
  menu.style.minWidth=r.width+'px';menu.style.maxHeight=mh+'px';menu.style.left=r.left+'px';menu.style.top='auto';menu.style.bottom='auto';
  menu.classList.add('on');
  if(up)menu.style.bottom=(innerHeight-r.top+6)+'px';else menu.style.top=(r.bottom+6)+'px';
  const s=menu.querySelector('.sel');if(s)menu.scrollTop=s.offsetTop-menu.clientHeight/2+s.clientHeight/2;
 }
 function enh(sel){
  if(sel.dataset.cs)return;sel.dataset.cs=1;
  const w=document.createElement('div');w.className='cs';
  const b=document.createElement('button');b.type='button';b.className='csb';
  const o=sel.options[sel.selectedIndex];b.innerHTML='<span></span>'+chev;b.firstChild.textContent=o?o.textContent:'';
  b.onclick=e=>{e.stopPropagation();open(sel,b)};
  sel.parentNode.insertBefore(w,sel);w.appendChild(b);w.appendChild(sel);sel.style.display='none';
 }
 const scan=()=>document.querySelectorAll('select:not([data-cs])').forEach(enh);
 new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
 document.addEventListener('mousedown',e=>{if(cur&&!menu.contains(e.target)&&!cur.btn.contains(e.target))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 addEventListener('resize',close);addEventListener('scroll',e=>{if(!menu.contains(e.target))close()},true);
})();
</script></body></html>
